<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Mail</title>
  <style nonce="__CSP_NONCE__">
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #f0f2f5;
      --text: #191b1f;
      --muted: #6b7280;
      --border: #d9dde5;
      --accent: #315efb;
      --accent-soft: #e9eeff;
      --success: #147d4f;
      --danger: #bd2c2c;
      --shadow: 0 10px 35px rgba(28, 33, 44, 0.08);
    }

    :root[data-theme="dark"] {
      --bg: #111318;
      --panel: #191c22;
      --panel-2: #22262e;
      --text: #eef0f4;
      --muted: #9ca3af;
      --border: #343a46;
      --accent: #8aa4ff;
      --accent-soft: #252f55;
      --success: #55c88d;
      --danger: #ff7b7b;
      --shadow: 0 10px 35px rgba(0, 0, 0, 0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111318;
        --panel: #191c22;
        --panel-2: #22262e;
        --text: #eef0f4;
        --muted: #9ca3af;
        --border: #343a46;
        --accent: #8aa4ff;
        --accent-soft: #252f55;
        --success: #55c88d;
        --danger: #ff7b7b;
        --shadow: 0 10px 35px rgba(0, 0, 0, 0.22);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .brand h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
    .brand p { margin: 5px 0 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .button {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      border-radius: 9px; padding: 8px 11px; box-shadow: none;
    }
    .button:hover { border-color: var(--accent); }
    .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    :root[data-theme="dark"] .button.primary { color: #101216; }
    .button.danger { color: var(--danger); }
    .grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr); gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
    .panel + .panel { margin-top: 18px; }
    .panel-head { display: flex; justify-content: space-between; gap: 12px; padding: 15px 17px; border-bottom: 1px solid var(--border); }
    .panel-head h2 { margin: 0; font-size: 16px; }
    .panel-body { padding: 16px 17px; }
    .muted { color: var(--muted); }
    .status-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 12px; border-radius: 10px; background: var(--panel-2); }
    .metric strong { display: block; font-size: 18px; margin-top: 2px; }
    .peer-list, .message-list { display: grid; gap: 9px; }
    .peer-list { max-height: 360px; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
    .message-list { max-height: min(68vh, 760px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
    .peer, .message { border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
    .peer.has-mail { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .peer-line, .message-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .peer-name, .message-subject { font-weight: 650; }
    .peer-actions { display: flex; align-items: center; gap: 8px; }
    .peer-actions .button { padding: 3px 7px; font-size: 11px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; background: var(--muted); }
    .dot.active { background: var(--success); }
    .address { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .compose-grid { display: grid; gap: 12px; }
    label.field { display: grid; gap: 6px; font-weight: 600; }
    input[type="text"], textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px;
      background: var(--bg); color: var(--text); outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    textarea { min-height: 128px; resize: vertical; }
    .recipient-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .recipient-actions .button { padding: 5px 8px; font-size: 12px; }
    .recipient-grid { display: grid; gap: 7px; max-height: 300px; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
    .recipient {
      display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
      padding: 8px 9px; border-radius: 8px; background: var(--panel-2);
    }
    .recipient label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .recipient input { vertical-align: -2px; }
    .compose-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .notice { min-height: 20px; color: var(--muted); }
    .notice.error { color: var(--danger); }
    .notice.success { color: var(--success); }
    .message-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .message-body { white-space: pre-wrap; margin: 10px 0 0; padding-top: 9px; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
    .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .chip { background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 2px 7px; font-size: 11px; }
    .chip.attention { background: var(--accent-soft); color: var(--accent); }
    .empty { padding: 12px; color: var(--muted); text-align: center; }
    .closed { max-width: 520px; margin: 18vh auto; text-align: center; padding: 28px; }
    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; }
      .actions { justify-content: flex-start; }
      .status-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main id="app" class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>Pi Mail</h1>
        <p data-i18n="subtitle">Local mailbox view for this project.</p>
      </div>
      <div class="actions">
        <button id="language" class="button" type="button">中文</button>
        <button id="theme" class="button" type="button" data-i18n="themeAuto">Theme: Auto</button>
        <button id="refresh" class="button" type="button" data-i18n="refresh">Refresh</button>
        <button id="close" class="button danger" type="button" data-i18n="closeServer">Close UI server</button>
      </div>
    </header>

    <div class="grid">
      <section>
        <div class="panel">
          <div class="panel-head"><h2 data-i18n="overview">Overview</h2><span id="identity" class="address"></span></div>
          <div class="panel-body"><div id="status" class="status-row"></div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2 data-i18n="messages">Recent messages</h2><span class="muted" data-i18n="messagesHint">latest 100</span></div>
          <div class="panel-body"><div id="messages" class="message-list"></div></div>
        </div>
      </section>

      <aside>
        <div class="panel">
          <div class="panel-head"><h2 data-i18n="compose">Compose as user</h2><span class="muted" data-i18n="humanOrigin">human origin</span></div>
          <div class="panel-body">
            <form id="compose-form" class="compose-grid">
              <div>
                <div class="peer-line"><strong data-i18n="recipients">Recipients</strong><span class="muted" data-i18n="recipientHint">choose To / Cc</span></div>
                <div class="recipient-actions">
                  <button id="select-active" class="button" type="button" data-i18n="selectActive">To: all active</button>
                  <button id="clear-recipients" class="button" type="button" data-i18n="clearRecipients">Clear</button>
                </div>
                <div id="recipient-grid" class="recipient-grid"></div>
              </div>
              <label class="field"><span data-i18n="subject">Subject</span><input id="subject" type="text" maxlength="200"></label>
              <label class="field"><span data-i18n="body">Message</span><textarea id="body" required></textarea></label>
              <div class="compose-footer"><span id="compose-notice" class="notice"></span><button class="button primary" type="submit" data-i18n="send">Send</button></div>
            </form>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2 data-i18n="peers">Sessions</h2><span id="peer-count" class="muted"></span></div>
          <div class="panel-body"><div id="peers" class="peer-list"></div></div>
        </div>
      </aside>
    </div>
  </main>

  <section id="closed" class="panel closed" hidden>
    <h1>Pi Mail</h1>
    <p data-i18n="closed">The Web UI server has been closed. You can close this tab.</p>
  </section>

  <script nonce="__CSP_NONCE__">
    (() => {
      const translations = {
        en: {
          subtitle: "Local mailbox view for this project.", themeAuto: "Theme: Auto", themeLight: "Theme: Light", themeDark: "Theme: Dark",
          refresh: "Refresh", closeServer: "Close UI server", overview: "Overview", messages: "Recent messages", messagesHint: "latest 100",
          compose: "Compose as user", humanOrigin: "human origin", recipients: "Recipients", recipientHint: "choose To / Cc", subject: "Subject",
          body: "Message", send: "Send", peers: "Sessions", activePeers: "Active peers", unreadTo: "Unpresented To", unreadCc: "Unpresented Cc", reminder: "Stale reminder", reminderOff: "Off",
          active: "active", inactive: "historical", noPeers: "No sessions found.", noMessages: "No messages yet.", to: "To", cc: "Cc",
          sendSuccess: "Message delivered.", chooseRecipient: "Choose at least one To recipient.", sendFailed: "Send failed", loadFailed: "Failed to load mail state",
          delivered: "delivered", presented: "presented", pending: "not presented", user: "user", closeConfirm: "Close the Pi Mail Web UI server?",
          closed: "The Web UI server has been closed. You can close this tab.", current: "current", selectActive: "To: all active", clearRecipients: "Clear",
          deleteMailbox: "Delete mailbox", deleteConfirm: "Delete mailbox for {name}? Its inbox state will be removed. Shared project messages remain available to other participants.",
          deleteSuccess: "Mailbox deleted.", deleteFailed: "Delete failed", waitingTo: "To waiting", waitingCc: "Cc waiting", oldest: "oldest", reminderEvery: "remind after {minutes}m"
        },
        zh: {
          subtitle: "当前项目的本地邮箱监督视图。", themeAuto: "主题：自动", themeLight: "主题：亮色", themeDark: "主题：暗色",
          refresh: "刷新", closeServer: "关闭 UI 服务", overview: "概览", messages: "最近邮件", messagesHint: "最近 100 封",
          compose: "以用户身份写信", humanOrigin: "用户来源", recipients: "收件人", recipientHint: "选择 To / Cc", subject: "主题",
          body: "正文", send: "发送", peers: "Sessions", activePeers: "活跃端点", unreadTo: "未呈现 To", unreadCc: "未呈现 Cc", reminder: "滞留提醒", reminderOff: "关闭",
          active: "活跃", inactive: "历史", noPeers: "当前没有可显示的 session。", noMessages: "还没有邮件。", to: "To", cc: "Cc",
          sendSuccess: "邮件已投递。", chooseRecipient: "至少选择一个 To 收件人。", sendFailed: "发送失败", loadFailed: "加载邮箱状态失败",
          delivered: "已投递", presented: "已呈现", pending: "未呈现", user: "用户", closeConfirm: "确定关闭 Pi Mail Web UI 服务？",
          closed: "Web UI 服务已关闭，可以关闭此页面。", current: "当前", selectActive: "To：全部活跃", clearRecipients: "清空",
          deleteMailbox: "删除邮箱", deleteConfirm: "确定删除 {name} 的邮箱吗？该 session 的收件箱状态会被移除；与其他参与者共享的项目邮件仍会保留。",
          deleteSuccess: "邮箱已删除。", deleteFailed: "删除失败", waitingTo: "To 待处理", waitingCc: "Cc 待处理", oldest: "最久", reminderEvery: "{minutes} 分钟后提醒"
        }
      };

      const params = new URLSearchParams(location.search);
      const tokenFromUrl = params.get("token");
      if (tokenFromUrl) sessionStorage.setItem("pi-mail-token", tokenFromUrl);
      const token = tokenFromUrl || sessionStorage.getItem("pi-mail-token") || "";
      if (tokenFromUrl) history.replaceState({}, "", location.pathname);

      let language = localStorage.getItem("pi-mail-language") || (navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");
      let theme = localStorage.getItem("pi-mail-theme") || "auto";
      let state = null;

      const $ = (id) => document.getElementById(id);
      const t = (key) => translations[language][key] || key;
      const escapeText = (value) => String(value ?? "");
      const formatTime = (value) => value ? new Intl.DateTimeFormat(language === "zh" ? "zh-CN" : "en-US", { dateStyle: "short", timeStyle: "medium" }).format(new Date(value)) : "—";
      const formatAge = (value) => {
        if (!value) return "—";
        const minutes = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 60000));
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        if (hours < 48) return `${hours}h`;
        return `${Math.floor(hours / 24)}d`;
      };

      function applyLanguage() {
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t(node.dataset.i18n); });
        $("language").textContent = language === "zh" ? "English" : "中文";
        applyTheme();
        if (state) render(state);
      }

      function applyTheme() {
        if (theme === "auto") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", theme);
        $("theme").textContent = t(theme === "auto" ? "themeAuto" : theme === "light" ? "themeLight" : "themeDark");
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { "authorization": `Bearer ${token}`, "content-type": "application/json", ...(options.headers || {}) }
        });
        const value = await response.json();
        if (!response.ok) throw new Error(value.error || `HTTP ${response.status}`);
        return value;
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function interpolate(template, values) {
        return Object.entries(values).reduce((text, [key, value]) => text.replaceAll(`{${key}}`, String(value)), template);
      }

      async function deleteMailbox(peer) {
        if (peer.active || peer.self) return;
        if (!confirm(interpolate(t("deleteConfirm"), { name: `${peerDisplayName(peer)} · ${peerAddress(peer)}` }))) return;
        try {
          await api("/api/delete-mailbox", { method: "POST", body: JSON.stringify({ session_id: peer.id }) });
          $("compose-notice").className = "notice success";
          $("compose-notice").textContent = t("deleteSuccess");
          await refresh();
        } catch (error) {
          $("compose-notice").className = "notice error";
          $("compose-notice").textContent = `${t("deleteFailed")}: ${escapeText(error.message)}`;
        }
      }

      function peerDisplayName(peer) {
        return peer.sessionName || peer.alias;
      }

      function peerAddress(peer) {
        return peer.sessionName && peer.sessionName !== peer.alias
          ? `${peer.alias} · ${peer.shortId}`
          : peer.shortId;
      }

      function renderStatus(data) {
        const identityName = data.status.sessionName || data.status.alias;
        const identityAddress = data.status.sessionName && data.status.sessionName !== data.status.alias
          ? `${data.status.alias} · ${data.status.shortId}`
          : data.status.shortId;
        $("identity").textContent = `${identityName} · ${identityAddress}`;
        const metrics = [
          [t("activePeers"), data.status.activePeerCount],
          [t("unreadTo"), data.status.unpresented.to],
          [t("unreadCc"), data.status.unpresented.cc],
          [t("reminder"), data.status.reminderAfterMinutes == null ? t("reminderOff") : `${data.status.reminderAfterMinutes}m`]
        ];
        $("status").replaceChildren(...metrics.map(([label, value]) => {
          const card = element("div", "metric");
          card.append(element("span", "muted", label), element("strong", "", value));
          return card;
        }));
      }

      function renderPeers(peers) {
        $("peer-count").textContent = String(peers.length);
        if (!peers.length) { $("peers").replaceChildren(element("div", "empty", t("noPeers"))); return; }
        $("peers").replaceChildren(...peers.map((peer) => {
          const pendingTo = peer.pending?.to || 0;
          const pendingCc = peer.pending?.cc || 0;
          const card = element("div", `peer ${pendingTo + pendingCc > 0 ? "has-mail" : ""}`);
          const top = element("div", "peer-line");
          const name = element("div", "peer-name");
          const dot = element("span", `dot ${peer.active ? "active" : ""}`);
          name.append(dot, document.createTextNode(`${peerDisplayName(peer)}${peer.self ? ` · ${t("current")}` : ""}`));
          const actions = element("div", "peer-actions");
          actions.append(element("span", "muted", t(peer.active ? "active" : "inactive")));
          if (!peer.active && !peer.self) {
            const remove = element("button", "button danger", t("deleteMailbox"));
            remove.type = "button";
            remove.addEventListener("click", () => void deleteMailbox(peer));
            actions.append(remove);
          }
          top.append(name, actions);

          const chips = element("div", "chips");
          if (pendingTo > 0) chips.append(element("span", "chip attention", `${t("waitingTo")}: ${pendingTo}`));
          if (pendingCc > 0) chips.append(element("span", "chip", `${t("waitingCc")}: ${pendingCc}`));
          if (peer.pending?.oldestToAt) chips.append(element("span", "chip", `${t("oldest")}: ${formatAge(peer.pending.oldestToAt)}`));
          if (peer.reminderAfterMinutes != null) {
            chips.append(element("span", "chip", interpolate(t("reminderEvery"), { minutes: peer.reminderAfterMinutes })));
          }

          card.append(
            top,
            element("div", "address", peerAddress(peer)),
            element("div", "address", peer.cwd || ""),
          );
          if (chips.childNodes.length) card.append(chips);
          return card;
        }));
      }

      function renderRecipients(peers) {
        const selectedTo = new Set([...document.querySelectorAll('input[data-kind="to"]:checked')].map((node) => node.dataset.peer));
        const selectedCc = new Set([...document.querySelectorAll('input[data-kind="cc"]:checked')].map((node) => node.dataset.peer));
        if (!peers.length) { $("recipient-grid").replaceChildren(element("div", "empty", t("noPeers"))); return; }
        $("recipient-grid").replaceChildren(...peers.map((peer) => {
          const row = element("div", "recipient");
          const name = element("div", "");
          name.append(
            element("span", `dot ${peer.active ? "active" : ""}`),
            document.createTextNode(`${peerDisplayName(peer)}${peer.self ? ` · ${t("current")}` : ""}`),
            element("div", "address", peerAddress(peer)),
          );
          const toLabel = element("label", "");
          const toInput = document.createElement("input");
          toInput.type = "checkbox"; toInput.dataset.kind = "to"; toInput.dataset.peer = peer.id; toInput.checked = selectedTo.has(peer.id);
          toLabel.append(toInput, document.createTextNode(` ${t("to")}`));
          const ccLabel = element("label", "");
          const ccInput = document.createElement("input");
          ccInput.type = "checkbox"; ccInput.dataset.kind = "cc"; ccInput.dataset.peer = peer.id; ccInput.checked = selectedCc.has(peer.id);
          ccLabel.append(ccInput, document.createTextNode(` ${t("cc")}`));
          toInput.addEventListener("change", () => { if (toInput.checked) ccInput.checked = false; });
          ccInput.addEventListener("change", () => { if (ccInput.checked) toInput.checked = false; });
          row.append(name, toLabel, ccLabel);
          return row;
        }));
      }

      function renderMessages(messages) {
        if (!messages.length) { $("messages").replaceChildren(element("div", "empty", t("noMessages"))); return; }
        $("messages").replaceChildren(...messages.map((message) => {
          const card = element("article", "message");
          const head = element("div", "message-head");
          head.append(element("div", "message-subject", message.subject), element("div", "message-meta", formatTime(message.createdAt)));
          const recipients = message.to.map((p) => p.alias).join(", ");
          const cc = message.cc.length ? ` · Cc: ${message.cc.map((p) => p.alias).join(", ")}` : "";
          const origin = message.senderKind === "human" ? t("user") : message.from.alias;
          const meta = element("div", "message-meta", `${origin} → ${recipients}${cc} · ${message.shortId}`);
          const body = element("div", "message-body", message.body);
          const chips = element("div", "chips");
          message.recipients.forEach((recipient) => {
            const stateText = recipient.presentedAt ? t("presented") : recipient.deliveredAt ? t("delivered") : t("pending");
            chips.append(element("span", "chip", `${recipient.kind.toUpperCase()} ${recipient.alias}: ${stateText}`));
          });
          card.append(head, meta, body, chips);
          return card;
        }));
      }

      function render(data) {
        renderStatus(data);
        renderPeers(data.peers);
        renderRecipients(data.peers);
        renderMessages(data.messages);
      }

      async function refresh() {
        try {
          state = await api("/api/state");
          render(state);
        } catch (error) {
          $("compose-notice").className = "notice error";
          $("compose-notice").textContent = `${t("loadFailed")}: ${escapeText(error.message)}`;
        }
      }

      $("compose-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const to = [...document.querySelectorAll('input[data-kind="to"]:checked')].map((node) => node.dataset.peer);
        const cc = [...document.querySelectorAll('input[data-kind="cc"]:checked')].map((node) => node.dataset.peer);
        if (!to.length) {
          $("compose-notice").className = "notice error";
          $("compose-notice").textContent = t("chooseRecipient");
          return;
        }
        try {
          await api("/api/send", { method: "POST", body: JSON.stringify({ to, cc, subject: $("subject").value, body: $("body").value }) });
          $("compose-notice").className = "notice success";
          $("compose-notice").textContent = t("sendSuccess");
          $("subject").value = ""; $("body").value = "";
          document.querySelectorAll('#recipient-grid input[type="checkbox"]').forEach((node) => { node.checked = false; });
          await refresh();
        } catch (error) {
          $("compose-notice").className = "notice error";
          $("compose-notice").textContent = `${t("sendFailed")}: ${escapeText(error.message)}`;
        }
      });


      $("select-active").addEventListener("click", () => {
        if (!state) return;
        const activeIds = new Set(state.peers.filter((peer) => peer.active).map((peer) => peer.id));
        document.querySelectorAll('input[data-kind="to"]').forEach((node) => { node.checked = activeIds.has(node.dataset.peer); });
        document.querySelectorAll('input[data-kind="cc"]').forEach((node) => { if (activeIds.has(node.dataset.peer)) node.checked = false; });
      });
      $("clear-recipients").addEventListener("click", () => {
        document.querySelectorAll('#recipient-grid input[type="checkbox"]').forEach((node) => { node.checked = false; });
      });

      $("language").addEventListener("click", () => {
        language = language === "zh" ? "en" : "zh";
        localStorage.setItem("pi-mail-language", language);
        applyLanguage();
      });
      $("theme").addEventListener("click", () => {
        theme = theme === "auto" ? "light" : theme === "light" ? "dark" : "auto";
        localStorage.setItem("pi-mail-theme", theme);
        applyTheme();
      });
      $("refresh").addEventListener("click", refresh);
      $("close").addEventListener("click", async () => {
        if (!confirm(t("closeConfirm"))) return;
        try { await api("/api/close", { method: "POST", body: "{}" }); } catch {}
        $("app").hidden = true; $("closed").hidden = false;
      });

      applyLanguage();
      void refresh();
      setInterval(() => void refresh(), 3000);
    })();
  </script>
</body>
</html>
